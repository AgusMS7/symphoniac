name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + integración)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Tests
        run: sh ./mvnw -B verify

  frontend:
    name: Frontend (unit + componente)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright contra el stack demo)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Instalar Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Levantar stack demo
        run: docker compose up -d --build

      - name: Esperar frontend y API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8081 >/dev/null 2>&1 \
              && curl -fsS http://localhost:8081/api/instrumentos >/dev/null 2>&1; then
              echo "Stack listo"
              exit 0
            fi
            sleep 5
          done
          echo "El stack no respondió a tiempo" >&2
          docker compose logs --tail=120
          exit 1

      - name: Tests E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Subir reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Bajar stack
        if: always()
        run: docker compose down -v
