spring.application.name=instrumentos-back-spring
# Configuración del servidor
server.port=3001

# Configuración de PostgreSQL
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/InstrumentosDB
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Archivos estáticos
spring.web.resources.static-locations=file:public/

# CORS
cors.allowed-origins=http://127.0.0.1:5173,http://127.0.0.1:3000